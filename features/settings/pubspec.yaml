resolution: workspace
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.0.3
  go_router: ^17.3.0

  core:
    path: ../../packages/core
  translations:
    path: ../../packages/translations
  ui_kit:
    path: ../../packages/ui_kit
  local_db:
    path: ../../packages/local_db

  file_picker: ^8.3.7
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
