name: bedeh_bestan
description: "بده‌بستان — a local-only personal money, calendar, and notes app."
publish_to: none
resolution: workspace
version: 1.0.2+0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  flutter_local_notifications: ^22.3.0
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.0
  file_picker: ^10.3.10
  package_info_plus: ^9.0.0

  core:
    path: ../../packages/core
  local_db:
    path: ../../packages/local_db
  translations:
    path: ../../packages/translations
  ui_kit:
    path: ../../packages/ui_kit

  feature_calendar:
    path: ../../features/calendar
  feature_home:
    path: ../../features/home
  feature_money:
    path: ../../features/money
  feature_notes:
    path: ../../features/notes
  feature_settings:
    path: ../../features/settings
  feature_profile:
    path: ../../features/profile

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
    # Keep Flutter Web from downloading Roboto from Google Fonts.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
